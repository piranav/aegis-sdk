[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk"
version = "0.1.0"
description = "Python client and agent-framework integrations for the Aegis governance gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Aegis" }]
dependencies = ["httpx>=0.28.1,<1", "pydantic>=2.12.2,<3", "anyio>=4.14.2"]

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.22.3,<0.23", "mcp>=1.28.1", "pydantic-settings>=2.14.2"]
claude-agent = ["claude-agent-sdk>=0.2.163,<0.3", "mcp>=1.28.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.15", "build>=1.2", "pip-audit>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
