name: SDK CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,openai-agents,claude-agent]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip-audit
      - run: python -m build
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: python -c "from aegis_sdk import ActionContext, AegisGatewayClient"
